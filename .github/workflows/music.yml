# Keeps the "Recently played" section fresh: every 3 hours, asks Apple Music for my recently played albums
# and commits assets/music.json when the list changed. Also runs on demand (Actions > Recently played > Run workflow).
name: Recently played
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: music
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch recently played albums
        run: node tools/music/fetch.mjs
        env:
          MUSICKIT_PRIVATE_KEY: ${{ secrets.MUSICKIT_PRIVATE_KEY }}
          MUSICKIT_KEY_ID: ${{ secrets.MUSICKIT_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MUSIC_USER_TOKEN: ${{ secrets.MUSIC_USER_TOKEN }}
      - name: Commit if the list changed
        run: |
          [ -z "$(git status --porcelain assets/music.json)" ] && exit 0
          git config user.name "music-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music.json
          git commit -m "Recently played: update albums"
          git push
