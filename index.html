if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro');

<style>
:root{--fg:#222;--bg:#fff;--logo:#191919}
@media(prefers-color-scheme:dark){:root{--fg:#ddd;--bg:#16171d;--logo:#fff}a{color:#8ab4ff}}
body{font:16px/1.6 system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;color:var(--fg);background:var(--bg)}
#intro{display:none}
.intro #intro{display:flex;position:fixed;inset:0;z-index:10;align-items:center;justify-content:center;background:var(--bg);cursor:pointer;transition:opacity .5s ease-out}
.intro #intro.out{opacity:0;pointer-events:none}
#intro svg{width:min(42vmin,260px);height:auto;overflow:visible}
#intro path{fill:none;stroke:var(--logo);stroke-width:32.2484;stroke-linecap:round;stroke-linejoin:round;opacity:0}

<div id="intro" aria-hidden="true">

<script>
(function () {
  var intro = document.getElementById('intro');
  if (!document.documentElement.classList.contains('intro')) { intro.remove(); return; }
  var WRITE = 2000, HOLD = 300, FADE = 500; // ms, same timings as the app
  var paths = [].slice.call(intro.querySelectorAll('path'));
  var lens = paths.map(function (p) { return p.getTotalLength(); });
  var total = lens.reduce(function (a, b) { return a + b; }, 0);
  var start = null, done = false;
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; } // ease in-out
  function draw(p) { // p = 0..1 of the whole pen trip
    var ink = p * total;
    paths.forEach(function (path, i) {
      var d = Math.max(0, Math.min(lens[i], ink));
      ink -= lens[i];
      path.style.opacity = d > 0 ? 1 : 0;
      path.style.strokeDasharray = d + ' ' + (lens[i] + 1);
    });
  }
  function finish() {
    if (done) return; done = true;
    draw(1);
    intro.classList.add('out');
    setTimeout(function () { intro.remove(); document.documentElement.classList.remove('intro'); }, FADE + 50);
  }
  function frame(now) {
    if (done) return;
    if (start === null) start = now;
    var t = now - start;
    draw(ease(Math.min(1, t / WRITE)));
    if (t >= WRITE + HOLD) finish(); else requestAnimationFrame(frame);
  }
  intro.addEventListener('click', finish);
  addEventListener('keydown', finish, { once: true });
  draw(0);
  requestAnimationFrame(frame);
})();
</script>
